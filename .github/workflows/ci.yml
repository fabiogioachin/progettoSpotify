name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements-dev.txt
      - name: Lint with ruff
        run: |
          cd backend
          ruff check app/

  backend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Nessun servizio Postgres/Redis: la suite non ne apre nessuno. Verificato
    # eseguendola con DATABASE_URL e REDIS_URL puntati a porte chiuse — 536 test
    # passati lo stesso. I test che toccano il DB usano AsyncMock, e il lifespan
    # dell'app tollera l'assenza di entrambi. Aggiungere servizi qui darebbe la
    # falsa impressione che servano.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements-dev.txt
      - name: Run tests
        run: |
          cd backend
          pytest -q

  frontend-lint-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: |
          cd frontend
          npm install
      - name: Lint with ESLint
        run: |
          cd frontend
          npm run lint
      - name: Build
        run: |
          cd frontend
          npm run build
